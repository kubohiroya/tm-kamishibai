packages:
  - .

allowBuilds:
  '@kubohiroya/sb3-toolchain@https://codeload.github.com/kubohiroya/sb3-toolchain/tar.gz/b3f4b9aa3ed3ede363700be815fe522f6a47df0b': true
  esbuild: true
  fsevents: false

minimumReleaseAgeExclude:
  - '@kubohiroya/turbowarp-async-input@0.3.0'
  - '@kubohiroya/turbowarp-asset-manager@0.8.0'
  - '@kubohiroya/turbowarp-runtime-expression@0.3.0'
  - '@kubohiroya/turbowarp-svg-text@0.3.0'
  - '@kubohiroya/turbowarp-tmpose@1.6.1'

overrides:
  'scratch-vm>scratch-parser': 6.0.0
  'scratch-vm>uuid': 11.1.1
  'scratch-vm>worker-loader': '-'

peerDependencyRules:
  allowedVersions:
    scratch-render-fonts: 1.0.0
