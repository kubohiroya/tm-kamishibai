packages:
  - .

allowBuilds:
  es5-ext: false
  esbuild: true
  fsevents: false

minimumReleaseAgeExclude:
  - '@kubohiroya/sb3-toolchain@0.10.0'
  - '@kubohiroya/turbowarp-async-input@0.6.0'
  - '@kubohiroya/turbowarp-asset-manager@0.14.0'
  - '@kubohiroya/turbowarp-app-shell@0.2.0'
  - '@kubohiroya/turbowarp-bubble@0.11.0'
  - '@kubohiroya/turbowarp-runtime-expression@0.5.0'
  - '@kubohiroya/turbowarp-svg-text@0.9.0'
  - '@kubohiroya/turbowarp-tm@2.0.0'
  - '@kubohiroya/turbowarp-runtime-host@0.2.0'
  - '@kubohiroya/turbowarp-preview-runtime@0.2.0'
  - '@kubohiroya/turbowarp-extension-manifest@0.2.0'
  - '@kubohiroya/turbowarp-local-preview@0.1.0'
  - '@kubohiroya/vite-plugin-turbowarp-extension@0.3.0'

overrides:
  'scratch-vm>scratch-parser': 6.0.0
  'scratch-vm>uuid': 11.1.1
  'scratch-vm>worker-loader': '-'

peerDependencyRules:
  allowedVersions:
    scratch-render-fonts: 1.0.0
