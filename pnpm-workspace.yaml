packages:
  - .

allowBuilds:
  es5-ext: false
  esbuild: true
  fsevents: false

minimumReleaseAgeExclude:
  - '@kubohiroya/sb3-toolchain@0.15.0'
  - '@kubohiroya/turbowarp-async-input@0.7.0'
  - '@kubohiroya/turbowarp-asset-cache@0.1.0'
  - '@kubohiroya/turbowarp-kvs@0.2.0'
  - '@kubohiroya/turbowarp-app-shell@0.2.1'
  - '@kubohiroya/turbowarp-bubble@0.13.0'
  - '@kubohiroya/turbowarp-runtime-expression@0.6.0'
  - '@kubohiroya/turbowarp-svg-text@0.10.0'
  - '@kubohiroya/turbowarp-camera-source@0.15.0'
  - '@kubohiroya/turbowarp-teachable-machine@3.5.1'
  - '@kubohiroya/turbowarp-runtime-adapter@0.2.0'
  - '@kubohiroya/turbowarp-live-reload-controller@0.2.0'
  - '@kubohiroya/turbowarp-extension-manifest@0.2.0'
  - '@kubohiroya/turbowarp-local-preview@0.1.1'
  - '@kubohiroya/turbowarp-named-data@0.1.0'
  - '@kubohiroya/vite-plugin-turbowarp-extension@0.5.0'
  - '@kubohiroya/turbowarp-kamishibai-site-navigation@0.2.0'

overrides:
  'scratch-vm>scratch-parser': 6.0.0
  'scratch-vm>uuid': 11.1.1
  'scratch-vm>worker-loader': '-'

patchedDependencies:
  '@kubohiroya/sb3-toolchain@0.15.0': patches/@kubohiroya__sb3-toolchain@0.15.0.patch

peerDependencyRules:
  allowedVersions:
    scratch-render-fonts: 1.0.0
