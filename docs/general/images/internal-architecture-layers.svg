<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">紙芝居アプリ内部構造のレイヤー</title>
  <desc id="desc">
    操作と表示、Stageによる統括、実行調停、ActorとAssetの実行、TurboWarp基盤とSB3データという5層の責務と、上位から下位への処理委譲を示す図。
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b3f32"/>
    </marker>
    <style>
      .layer {
        stroke: #9e4635;
        stroke-width: 2.5;
        rx: 16;
      }
      .layer-1 {
        fill: #fffaf4;
      }
      .layer-2 {
        fill: #f8e2d6;
      }
      .layer-3 {
        fill: #fff3e8;
      }
      .layer-4 {
        fill: #f6e9df;
      }
      .layer-5 {
        fill: #efe8e3;
      }
      .number {
        fill: #9e4635;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 24px;
        font-weight: 700;
        text-anchor: middle;
      }
      .label {
        fill: #2f2926;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 24px;
        font-weight: 700;
      }
      .detail {
        fill: #554b46;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 16px;
      }
      .code {
        fill: #5f3329;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 15px;
      }
      .arrow {
        fill: none;
        stroke: #7b3f32;
        stroke-width: 2.2;
        marker-end: url(#arrow);
      }
      .arrow-label {
        fill: #5f3329;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 15px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="layer layer-1" x="80" y="25" width="840" height="100"/>
  <circle cx="125" cy="75" r="24" fill="#f8e2d6" stroke="#9e4635" stroke-width="2"/>
  <text class="number" x="125" y="83">1</text>
  <text class="label" x="170" y="62">操作・表示レイヤー</text>
  <text class="detail" x="170" y="91">利用者への表示と入力受付</text>
  <text class="code" x="510" y="62">prompt / menu buttons / Loading</text>
  <text class="code" x="510" y="91">key / touch / camera / script file</text>

  <rect class="layer layer-2" x="80" y="155" width="840" height="100"/>
  <circle cx="125" cy="205" r="24" fill="#fffaf4" stroke="#9e4635" stroke-width="2"/>
  <text class="number" x="125" y="213">2</text>
  <text class="label" x="170" y="192">Stage統括レイヤー</text>
  <text class="detail" x="170" y="221">台本解析、scene/action実行、遷移制御</text>
  <text class="code" x="565" y="192">startStory / exec scene</text>
  <text class="code" x="565" y="221">exec actionList / transition</text>

  <rect class="layer layer-3" x="80" y="285" width="840" height="100"/>
  <circle cx="125" cy="335" r="24" fill="#f8e2d6" stroke="#9e4635" stroke-width="2"/>
  <text class="number" x="125" y="343">3</text>
  <text class="label" x="170" y="322">実行調停レイヤー</text>
  <text class="detail" x="170" y="351">target間のevent配送と状態共有</text>
  <text class="code" x="510" y="322">broadcast / custom block</text>
  <text class="code" x="510" y="351">runtime / thread variable / envelope</text>

  <rect class="layer layer-4" x="80" y="415" width="840" height="100"/>
  <circle cx="125" cy="465" r="24" fill="#fffaf4" stroke="#9e4635" stroke-width="2"/>
  <text class="number" x="125" y="473">4</text>
  <text class="label" x="170" y="452">Actor・Asset実行レイヤー</text>
  <text class="detail" x="170" y="481">登場人物と画像・音声・textの実処理</text>
  <text class="code" x="555" y="452">Actor clones / Asset Manager</text>
  <text class="code" x="555" y="481">costume / sound / text</text>

  <rect class="layer layer-5" x="80" y="545" width="840" height="100"/>
  <circle cx="125" cy="595" r="24" fill="#fffaf4" stroke="#9e4635" stroke-width="2"/>
  <text class="number" x="125" y="603">5</text>
  <text class="label" x="170" y="582">実行基盤・projectデータ</text>
  <text class="detail" x="170" y="611">VM、機能拡張、targetとblockの保存構造</text>
  <text class="code" x="555" y="582">TurboWarp VM / extensions</text>
  <text class="code" x="555" y="611">SB3 targets / blocks / assets</text>

  <path class="arrow" d="M 500 125 L 500 151"/>
  <path class="arrow" d="M 500 255 L 500 281"/>
  <path class="arrow" d="M 500 385 L 500 411"/>
  <path class="arrow" d="M 500 515 L 500 541"/>
  <text class="arrow-label" x="650" y="143">下位へ処理を委譲</text>
  <text class="arrow-label" x="650" y="273">event・状態を受け取る</text>
</svg>
