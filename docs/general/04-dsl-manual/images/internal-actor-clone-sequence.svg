<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
  <title id="title">台本のactor定義からアクターcloneを生成するシーケンス</title>
  <desc id="desc">
    actor commandの値をactorListへ登録し、Stageのcreate actorが各定義をactor名と初期skinへ分ける。StageはactionTargetとactionParamを設定してActorのcloneを作り、cloneは開始時にactorNameとskinを設定する。Stageは0.1秒待ってから次のactorを生成する。
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b3f32"/>
    </marker>
    <style>
      .participant {
        fill: #fffaf4;
        stroke: #9e4635;
        stroke-width: 2.5;
        rx: 14;
      }
      .participant-main {
        fill: #f8e2d6;
      }
      .participant-label {
        fill: #2f2926;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 21px;
        font-weight: 700;
        text-anchor: middle;
      }
      .participant-label-small {
        font-size: 17px;
      }
      .lifeline {
        fill: none;
        stroke: #9b8e87;
        stroke-width: 1.8;
        stroke-dasharray: 7 7;
      }
      .activation {
        fill: #f6d7c8;
        stroke: #9e4635;
        stroke-width: 1.8;
      }
      .message {
        fill: none;
        stroke: #7b3f32;
        stroke-width: 2.2;
        marker-end: url(#arrow);
      }
      .message-dashed {
        stroke-dasharray: 8 5;
      }
      .message-label {
        fill: #3f3531;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 16px;
        text-anchor: middle;
      }
      .message-label-end {
        text-anchor: end;
      }
      .code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      .frame {
        fill: #fffaf4;
        fill-opacity: 0.35;
        stroke: #b69b8f;
        stroke-width: 1.8;
        rx: 8;
      }
      .frame-tab {
        fill: #f2e6df;
        stroke: #b69b8f;
        stroke-width: 1.8;
      }
      .frame-label {
        fill: #5f3329;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 15px;
        font-weight: 700;
      }
      .note {
        fill: #f5f1eb;
        stroke: #b69b8f;
        stroke-width: 1.5;
        rx: 8;
      }
      .note-text {
        fill: #554b46;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 15px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="participant" x="30" y="25" width="190" height="68"/>
  <text class="participant-label" x="125" y="54">台本内の</text>
  <text class="participant-label" x="125" y="79">command</text>

  <rect class="participant participant-main" x="295" y="25" width="190" height="68"/>
  <text class="participant-label" x="390" y="67">Stage</text>

  <rect class="participant" x="540" y="25" width="220" height="68"/>
  <text class="participant-label" x="650" y="54">Stage内の</text>
  <text class="participant-label participant-label-small" x="650" y="79">
    list・runtime variable
  </text>

  <rect class="participant participant-main" x="795" y="25" width="180" height="68"/>
  <text class="participant-label" x="885" y="54">Actor target</text>
  <text class="participant-label" x="885" y="79">／clone</text>

  <path class="lifeline" d="M 125 93 L 125 900"/>
  <path class="lifeline" d="M 390 93 L 390 900"/>
  <path class="lifeline" d="M 650 93 L 650 900"/>
  <path class="lifeline" d="M 885 93 L 885 900"/>

  <rect class="frame" x="250" y="265" width="710" height="620"/>
  <path class="frame-tab" d="M 250 265 H 445 L 465 288 H 250 z"/>
  <text class="frame-label" x="265" y="283">
    <tspan class="code">actorList</tspan>の定義ごとに反復
  </text>

  <rect class="activation" x="382" y="125" width="16" height="735"/>
  <rect class="activation" x="642" y="195" width="16" height="650"/>
  <rect class="activation" x="877" y="520" width="16" height="245"/>

  <g id="step-actor-command-register" aria-label="actor commandの値をactorListへ登録する">
    <path class="message" d="M 125 145 L 382 145"/>
    <text class="message-label" x="254" y="130">
      <tspan class="code">exec command actor 名前,初期skin</tspan>
    </text>
    <path class="message" d="M 398 215 L 642 215"/>
    <text class="message-label" x="520" y="200">
      値を<tspan class="code">actorList</tspan>へ追加
    </text>
  </g>

  <g id="step-create-actor-loop" aria-label="create actorがactorListの各定義を取り出す">
    <path class="message message-dashed" d="M 642 320 L 398 320"/>
    <text class="message-label" x="520" y="305">
      <tspan class="code">create actor</tspan>：次の<tspan class="code">名前,初期skin</tspan>
    </text>
  </g>

  <g id="step-split-actor-definition" aria-label="actor定義をactor名と初期skinへ分ける">
    <path class="message" d="M 398 375 H 510 V 415 H 405"/>
    <text class="message-label" x="520" y="365">
      <tspan class="code">name</tspan>と<tspan class="code">skin</tspan>へ分解
    </text>
    <text class="message-label" x="520" y="388">（thread variable）</text>
  </g>

  <g id="step-set-clone-initializers" aria-label="clone用の共有runtime variableを設定する">
    <path class="message" d="M 398 465 L 642 465"/>
    <text class="message-label" x="520" y="438">
      <tspan class="code">actionTarget = name</tspan>
    </text>
    <text class="message-label" x="520" y="458">
      <tspan class="code">actionParam = skin</tspan>
    </text>
  </g>

  <g id="step-create-actor-clone" aria-label="Actor targetのcloneを作る">
    <path class="message" d="M 398 540 L 877 540"/>
    <text class="message-label" x="637" y="525">
      <tspan class="code">Actor</tspan>のcloneを作る
    </text>
  </g>

  <g id="step-clone-start" aria-label="clone開始hatを実行する">
    <path class="message" d="M 893 585 H 960 V 620 H 900"/>
    <text class="message-label message-label-end" x="955" y="575">clone開始hat</text>
  </g>

  <g id="step-clone-read-name" aria-label="actionTargetをcloneローカルのactorNameへ設定する">
    <path class="message" d="M 642 665 L 877 665"/>
    <text class="message-label" x="760" y="638">
      <tspan class="code">actionTarget</tspan>を読む
    </text>
    <text class="message-label" x="760" y="658">
      → local <tspan class="code">actorName</tspan>
    </text>
  </g>

  <g id="step-clone-set-skin" aria-label="actionParamをAsset Managerのskinへ設定する">
    <path class="message" d="M 642 745 L 877 745"/>
    <text class="message-label" x="760" y="718">
      <tspan class="code">actionParam</tspan>を読む
    </text>
    <text class="message-label" x="760" y="738">→ Asset Managerのskin</text>
  </g>

  <g id="step-wait-before-next-actor" aria-label="0.1秒待ってから次のactor定義へ進む">
    <path class="message" d="M 398 815 H 510 V 850 H 405"/>
    <text class="message-label" x="520" y="805">0.1秒待つ</text>
    <text class="message-label" x="520" y="828">→ 次の定義へ</text>
  </g>

  <rect class="note" x="110" y="925" width="780" height="54"/>
  <text class="note-text" x="500" y="947">
    clone生成中はbroadcastしない。0.1秒の待機後、共有runtime variableを
  </text>
  <text class="note-text" x="500" y="968">次のアクター用の値で上書きする</text>

  <rect class="note" x="110" y="992" width="780" height="54"/>
  <text class="note-text" x="500" y="1014">
    <tspan class="code">Actor</tspan> target本体と生成直後のcloneは非表示。
  </text>
  <text class="note-text" x="500" y="1035">後続のActor actionで必要なcloneを表示する</text>
</svg>
