<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">紙芝居アプリの実行アーキテクチャ</title>
  <desc id="desc">
    DSLがブラウザ内のTurboWarpランタイムへ渡され、TurboWarp project内のDSLランタイムがproject targetと機能拡張を使って実行する構成。
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b3f32"/>
    </marker>
    <style>
      .boundary {
        fill: #fffdf9;
        stroke: #7b3f32;
        stroke-width: 3;
        rx: 20;
      }
      .runtime {
        fill: #f8e2d6;
        stroke: #9e4635;
        stroke-width: 2.5;
        rx: 16;
      }
      .project {
        fill: #fff7ef;
        stroke: #b86a55;
        stroke-width: 2.5;
        rx: 16;
      }
      .extension {
        fill: #f6e9df;
        stroke: #9e4635;
        stroke-width: 2.5;
        rx: 16;
      }
      .dsl {
        fill: #fffaf4;
        stroke: #9e4635;
        stroke-width: 2.5;
        rx: 16;
      }
      .subsystem {
        fill: #fff;
        stroke: #c58a77;
        stroke-width: 2;
        rx: 12;
      }
      .browser-api {
        fill: #efe8e3;
        stroke: #9e4635;
        stroke-width: 2;
        rx: 12;
      }
      .title {
        fill: #2f2926;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 28px;
        font-weight: 700;
      }
      .label {
        fill: #2f2926;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 22px;
        font-weight: 700;
      }
      .detail {
        fill: #554b46;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 16px;
      }
      .code {
        fill: #5f3329;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 15px;
      }
      .edge {
        fill: none;
        stroke: #7b3f32;
        stroke-width: 2.2;
        marker-end: url(#arrow);
      }
      .edge-dashed {
        stroke-dasharray: 8 7;
      }
      .edge-label {
        fill: #5f3329;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        font-size: 15px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="dsl" x="25" y="300" width="190" height="150"/>
  <text class="label" x="120" y="340" text-anchor="middle">紙芝居DSL</text>
  <text class="detail" x="120" y="372" text-anchor="middle">外部ファイル</text>
  <text class="detail" x="120" y="398" text-anchor="middle">またはSB3内へ埋め込み</text>
  <text class="code" x="120" y="428" text-anchor="middle">source.txt / script</text>

  <rect class="boundary" x="245" y="25" width="850" height="710"/>
  <text class="title" x="280" y="68">ブラウザ</text>
  <text class="detail" x="405" y="68">HTML / JavaScript実行環境</text>

  <rect class="runtime" x="285" y="95" width="770" height="120"/>
  <text class="label" x="325" y="137">TurboWarpランタイム</text>
  <text class="detail" x="325" y="170">SB3の読込、blockのスケジュール、描画、音声、入出力を管理</text>
  <text class="code" x="325" y="197">VM / scheduler / renderer / storage / I/O</text>

  <rect class="project" x="285" y="270" width="495" height="390"/>
  <text class="label" x="320" y="312">TurboWarp project（SB3）</text>
  <text class="detail" x="320" y="340">target、block、変数、画像、音声を保持</text>

  <rect class="subsystem" x="320" y="370" width="425" height="105"/>
  <text class="label" x="345" y="408">project target</text>
  <text class="detail" x="345" y="438">Stage / Actor clones / UI sprites</text>
  <text class="code" x="345" y="463">broadcast / Scratch variables / lists</text>

  <rect class="runtime" x="320" y="510" width="425" height="115"/>
  <text class="label" x="345" y="548">DSLランタイム</text>
  <text class="detail" x="345" y="577">Stageのblock群として台本を解析・実行</text>
  <text class="code" x="345" y="606">scene / action / branch / transition</text>

  <rect class="extension" x="815" y="270" width="240" height="390"/>
  <text class="label" x="935" y="312" text-anchor="middle">機能拡張</text>
  <text class="detail" x="845" y="355">Runtime / Thread Variables</text>
  <text class="detail" x="845" y="390">Asset Manager</text>
  <text class="detail" x="845" y="425">Async Input</text>
  <text class="detail" x="845" y="460">TMPose</text>
  <text class="detail" x="845" y="495">Text Lines / Expression</text>
  <text class="detail" x="845" y="530">Timers / Files / Text</text>
  <text class="code" x="845" y="580">Gallery + embedded</text>
  <text class="detail" x="845" y="615">projectへblockを提供</text>

  <rect class="browser-api" x="285" y="685" width="770" height="35"/>
  <text class="detail" x="670" y="708" text-anchor="middle">
    Browser APIs: DOM / Fetch / IndexedDB / MediaDevices / input events
  </text>

  <path class="edge" d="M 215 375 L 320 565"/>
  <text class="edge-label" x="262" y="440">入力</text>

  <path class="edge" d="M 500 215 L 500 266"/>
  <text class="edge-label" x="555" y="245">load / run</text>

  <path class="edge" d="M 875 215 L 920 266"/>
  <text class="edge-label" x="935" y="242">register</text>

  <path class="edge" d="M 532 510 L 532 479"/>
  <text class="edge-label" x="620" y="497">broadcast / state</text>

  <path class="edge" d="M 745 567 L 811 510"/>
  <text class="edge-label" x="786" y="555">call</text>

  <path class="edge edge-dashed" d="M 935 660 L 935 681"/>
  <path class="edge edge-dashed" d="M 670 215 L 670 681"/>
</svg>
