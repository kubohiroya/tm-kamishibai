<!doctype html>

<head>

  <link rel="stylesheet" href="../site-shell.css">
  <script type="module" src="../site-shell.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      --ink: #3f302b;
      --muted: #756960;
      --paper: #fffdf8;
      --canvas: #fff8ee;
      --accent: #963f2f;
      --line: #dbc9bb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    main { max-width: 1080px; margin: auto; padding: 40px 24px 72px; }
    h1 { margin-bottom: .35rem; font-size: clamp(2rem, 6vw, 3.5rem); }
    .lead { color: var(--muted); font-size: 1.1rem; line-height: 1.7; }
    .download-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 32px; }
    article { display: flex; flex-direction: column; min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 5px 18px rgb(89 61 43 / 8%); }
    article h2 { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; margin: 0; font-size: 1.45rem; }
    article p { line-height: 1.7; }
    .status { display: inline-block; padding: .25rem .6rem; border-radius: 999px; font-size: .78rem; line-height: 1.35; white-space: nowrap; }
    .status--past { background: #eee8e2; color: #62574f; }
    .status--stable { background: #e2f0df; color: #315b32; }
    .status--development { background: #f8e8c9; color: #71491a; }
    .actions { display: grid; gap: 8px; margin-top: auto; padding-top: .5rem; }
    .button { display: block; padding: 11px 14px; border-radius: 8px; background: var(--accent); color: white; text-align: center; text-decoration: none; font-weight: 700; }
    .button--secondary { border: 1px solid var(--accent); background: transparent; color: var(--accent); }
    .button--disabled { border: 1px solid var(--line); background: #eee8e2; color: var(--muted); cursor: not-allowed; }
    .file-info { margin-bottom: 0; color: var(--muted); font-size: .88rem; }
    .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 820px) {
      .download-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
