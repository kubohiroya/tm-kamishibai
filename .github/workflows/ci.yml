name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A pull request only needs its newest push verified. A push to main is a record of
# what main was checked with, so those runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full suite finishes in about three minutes. Anything near this ceiling is hung,
    # and without it a stuck run holds a runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same suite gates the merge and records main. A weaker pull-request check would
      # let e2e, packaging and the site build break main after a green review.
      - run: pnpm verify:full

  # Keep branch protection's required `test` status independent of the verification job.
  # Fail this gate unless verification succeeded, including when it was cancelled or skipped.
  test:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          printf 'verify: %s\n' '${{ needs.verify.result }}'
          test '${{ needs.verify.result }}' = success
