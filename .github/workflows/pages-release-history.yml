name: Verify published release history

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  deployments: read

jobs:
  verify-public-artifacts:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute verification code from the default branch, never from the static site snapshot.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify deployed versioned SB3 and Players over public URLs
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYED_SHA: ${{ github.event.build.commit }}
          PAGES_BUILD_CREATED_AT: ${{ github.event.build.created_at }}
        run: node scripts/verify-pages-release-history.ts
      - name: Save public release verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-release-history-${{ github.run_id }}
          path: tmp/pages-release-history/report.json
          if-no-files-found: warn
          retention-days: 14
