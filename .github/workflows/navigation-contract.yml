name: Navigation contract

on:
  push:
    # Without a branch filter this repeats the pull-request run on every branch push.
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-site.ts'
      - 'scripts/site-navigation.d.mts'
      - 'scripts/site-navigation.mjs'
      - 'scripts/verify-build.ts'
      - 'site/contracts/navigation-contract.json'
      - 'site/site-shell.css'
      - '.github/workflows/navigation-contract.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-site.ts'
      - 'scripts/site-navigation.d.mts'
      - 'scripts/site-navigation.mjs'
      - 'scripts/verify-build.ts'
      - 'site/contracts/navigation-contract.json'
      - 'site/site-shell.css'
      - '.github/workflows/navigation-contract.yml'

permissions:
  contents: read

concurrency:
  group: navigation-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-package-consumption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check application repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared navigation package consumption
        run: |
          test ! -e scripts/site-navigation.mjs
          test ! -e scripts/site-navigation.d.mts
          test ! -e site/contracts/navigation-contract.json
          test ! -e site/site-shell.css
          node --input-type=module -e "import('@kubohiroya/turbowarp-kamishibai-site-navigation').then((mod) => { if (mod.NAVIGATION_CONTRACT.contractVersion !== '2.0.0') throw new Error('Unexpected navigation contract version'); })"
