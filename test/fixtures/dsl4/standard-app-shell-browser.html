<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSL 4.0 Standard app shell browser fixture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 2rem auto;
        max-width: 36rem;
        padding: 0 1rem;
      }
      [data-dsl4-pose-feedback='true'] {
        gap: 0.75rem;
        padding: 1rem;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@kubohiroya/turbowarp-asset-manager/composition": "/node_modules/@kubohiroya/turbowarp-asset-manager/dist/composition.js",
          "@kubohiroya/turbowarp-async-input/composition": "/node_modules/@kubohiroya/turbowarp-async-input/dist/composition.js",
          "@kubohiroya/turbowarp-runtime-expression/composition": "/node_modules/@kubohiroya/turbowarp-runtime-expression/dist/composition.js",
          "@kubohiroya/turbowarp-svg-text/composition": "/node_modules/@kubohiroya/turbowarp-svg-text/dist/composition.js",
          "@kubohiroya/turbowarp-tm/composition": "/node_modules/@kubohiroya/turbowarp-tm/dist/composition.js",
          "fflate": "/node_modules/fflate/esm/browser.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Standard app shell fixture</h1>
      <p id="fixture-ready" role="status">Loading browser fixture…</p>
      <div id="standard-app-shell-mount"></div>
      <button id="fixture-complete" type="button">Complete pose</button>
      <button id="fixture-dispose" type="button">Dispose shell</button>
    </main>
    <script type="module" src="./standard-app-shell-browser.mjs"></script>
  </body>
</html>
