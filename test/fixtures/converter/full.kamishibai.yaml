kamishibai: "4.0"
controls:
  keymaps:
    production:
      Space: navigation.nextAction
assets:
  Beach: backdrop
  LoadingBackground:
    kind: backdrop
    name: Loading
  Loading1:
    kind: costume
    target: Loading
    name: loading-1
  Loading2:
    kind: costume
    target: Loading
    name: loading-2
  Ocean:
    kind: backdrop
    name: OceanBackdrop
  HeroIdle:
    kind: costume
    target: Hero
    name: hero-idle
  HeroHappy:
    kind: costume
    target: Hero
    name: hero-happy
  HeroHelp:
    kind: costume
    target: Hero
    name: hero-help
  CaptionIdle:
    kind: costume
    target: Caption
    name: caption-idle
  OpeningSound: sound
  ClockTicking: sound
  Success: sound
  RescuePose:
    kind: poseModel
    file: pose-models/rescue
    loading: lazy
actors:
  Hero: HeroIdle
  Caption: CaptionIdle
cover:
  backdrop: Beach
  bgm: OpeningSound
textStyles:
  title:
    background: "#112233"
    color: "#ffffff"
    font: Noto Sans JP
    size: 150
    align: center
    direction: up
variables:
  score: 1
  takeSeaRoute: false
  playerName: ななし
loading:
  backdrop: LoadingBackground
  costumes:
    - Loading1
    - Loading2
poseRecognition:
  idleSound: ClockTicking
  chargeSound: Success
branches:
  rescueResult:
    - if: score == 1
      goto: seaRoute
    - else: ending
scenes:
  opening:
    - stage: Beach
    - bgm: OpeningSound
    - Caption.setText:
        text: |-
          海へ出発！
          1か2を押してください
        style: title
    - Hero.show:
        skin: HeroHappy
        x: 0
        y: -60
        scale: 30
    - Hero.say:
        text: 助けに行こう
        seconds: 2
    - wait: 1
    - keyInputToChangeScene:
        Digit1: rescue
        Digit2: ending
  rescue:
    poseModel: RescuePose
    actions:
      - stage: Ocean
      - Hero.setSkin: HeroHelp
      - Hero.pose:
          steps:
            - pose: help
              skin: HeroHelp
              sound: Success
            - pose: jump
              skin: HeroHappy
              sound: Success
      - branch: rescueResult
  seaRoute:
    - Hero.moveTo:
        x: 40
        y: -57
        seconds: 1.5
    - Hero.say:
        text: 海路で帰ろう
        seconds: 2
    - transition:
        effect: fadeOut
        seconds: 0
  ending:
    - stage: Beach
    - Caption.setText:
        text: おしまい
        style: title
    - touchInputToChangeScene:
        Hero: opening
        Caption: rescue
